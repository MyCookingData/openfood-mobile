name: openfood_mobile
description: OpenFood - Application Mobile Client & Livreur (Martinique & Caraïbes)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.2.0
  confetti: ^0.8.0
  firebase_auth: ^6.3.0
  firebase_core: ^4.6.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  openfood_models:
    path: ../openfood-models
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^21.0.0
  flutter_map: ^8.2.2
  flutter_stripe: ^12.4.0
  geocoding: ^4.0.0
  google_fonts: ^6.1.0
  http: ^1.6.0
  latlong2: ^0.9.1
  provider: ^6.1.5+1
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  intl: ^0.20.3
  cloud_functions: ^6.3.5
  geolocator: ^14.0.3
  audioplayers: ^6.7.1
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  web:
    generate: true
    image_path: "assets/logo_splash.jpg"
    background_color: "#111A13"
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo_splash.jpg"
  remove_alpha_ios: true

