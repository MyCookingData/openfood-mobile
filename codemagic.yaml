workflows:
  ios-release:
    name: OpenFood iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic CI"
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: openfood.app
    scripts:
      - name: Fetch openfood-models dependency
        script: |
          cd ..
          rm -rf openfood-models
          git clone https://github.com/MyCookingData/openfood-models.git openfood-models
          cd $CM_BUILD_DIR
      - name: Disable Swift Package Manager (Enforce CocoaPods)
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Set up code signing on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build iOS App (IPA)
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - contact@cookingdata.fr
        notify:
          success: true
          failure: true
